# Temporary HTTP-only server used by issue-cert.sh to obtain the first certificate,
# before nginx/pypam.conf can be loaded (it needs the certificate files to exist).
# The domain comes from the generated snippet (see https-common.sh).
server {
    listen 80;
    listen [::]:80;
    include snippets/pypam-server-name.conf;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
