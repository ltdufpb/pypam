<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=yes">
<title>PyPAM Administração - Editor de Python Online do Prof. Alan Moraes</title>
<style>
:root {
    --primary: #007acc;
    --success: #28a745;
    --danger: #d73a49;
    --secondary: #e9ecef;
    --secondary-text: #495057;
    --bg-gray: #f8f9fa;
    --border: #dee2e6;
    --text: #1c1e21;
    --radius: 12px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg-gray);font-family:system-ui,-apple-system,sans-serif;color:var(--text);overflow-y:auto;}

/* AJUSTE AQUI: O container de login agora ocupa a tela inteira e centraliza o conteúdo */
#admin-login {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    width: 100%;
}

/* Removido o height daqui para evitar conflitos de escopo */
.login-screen {
    display:flex;align-items:center;justify-content:center;width:100%;
}
.login-box {
    background:#fff;padding:40px;border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);text-align:center;width:90%;max-width:400px;
}
h2 { margin-bottom:24px;font-size:24px;font-weight:600 }
input, .btn {
    font-family:inherit;padding:12px 16px;margin:8px 0;border-radius:var(--radius);border:1px solid var(--border);outline:none;font-size:16px;
}
input[type="text"], input[type="password"] {
    width:100%;background:#fff;color:var(--text);transition:border-color 0.2s;
}
input:focus { border-color:var(--primary);box-shadow:0 0 0 2px rgba(0,122,204,0.1) }
.btn {
    cursor:pointer;font-weight:600;transition:all 0.2s;text-align:center;border:none;
}
.btn-primary  { background:var(--primary);color:#fff;width:100%; }
.btn-primary:hover  { opacity:0.9; }
.btn-success  { background:var(--success);color:#fff; }
.btn-success:hover  { opacity:0.9; }
.btn-danger   { background:var(--danger);color:#fff; }
.btn-danger:hover   { opacity:0.9; }
.btn-secondary { background:var(--secondary);color:var(--secondary-text); }
.btn-secondary:hover { background:#dde1e3; }
#container { max-width:600px;margin:0 auto;padding:20px;display:none; }
header { display:flex;justify-content:space-between;align-items:center;margin-bottom:20px }
.user-card {
    background:#fff;padding:16px;border-radius:var(--radius);margin-bottom:12px;
    box-shadow:0 2px 8px rgba(0,0,0,0.05);display:flex;justify-content:space-between;align-items:center
}
.user-info { font-weight:600;font-size:16px;color:var(--text) }
.user-actions { display:flex;gap:8px }
#modal {
    position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);
    display:none;align-items:center;justify-content:center;z-index:100;padding:20px
}
#modal-box { background:#fff;padding:24px;border-radius:16px;width:100%;max-width:400px;text-align:center }
.modal-input { width:100%;margin-bottom:12px }
</style>
</head>
<body>

<div id="admin-login">
    <div class="login-screen">
        <div class="login-box">
            <h2>PyPAM Administração</h2>
            <input type="text" id="username" name="username" placeholder="Usuário"
                   autocomplete="username" autocapitalize="none" autocorrect="off"
                   onkeydown="if(event.key==='Enter') doAdminLogin()"/>
            <input type="password" id="password" name="password" placeholder="Senha"
                   autocomplete="current-password"
                   onkeydown="if(event.key==='Enter') doAdminLogin()"/>
            <button class="btn btn-primary" onclick="doAdminLogin()">ENTRAR</button>
            <div id="error-msg" style="color:var(--danger);font-size:14px;margin-top:12px;height:1.4em;"></div>
        </div>
    </div>
</div>

<div id="container">
    <header>
        <h2 style="font-size:20px">Estudantes</h2>
        <button class="btn btn-success" onclick="openModal()">+ NOVO</button>
    </header>
    <div id="user-list"></div>
</div>

<div id="modal">
    <div id="modal-box">
        <h3 id="modal-title" style="margin-bottom:16px">Novo Estudante</h3>
        <p id="modal-desc" style="color:var(--secondary-text);font-size:14px;margin-bottom:16px"></p>
        <input type="text"     id="m_u" class="modal-input" placeholder="Usuário"  autocomplete="username" />
        <input type="password" id="m_p" class="modal-input" placeholder="Senha"    autocomplete="new-password" />
        <div style="display:flex;gap:10px;margin-top:10px">
            <button class="btn btn-secondary" style="flex:1" onclick="closeModal()">CANCELAR</button>
            <button class="btn btn-primary"   style="flex:1" onclick="handleModalSave()">SALVAR</button>
        </div>
    </div>
</div>

<script>
var editing_u = null;

async function doAdminLogin() {
    var u = document.getElementById("username").value.trim();
    var p = document.getElementById("password").value;
    var res  = await fetch("/admin/login", {
        method:  "POST",
        headers: {"Content-Type": "application/json"},
        body:    JSON.stringify({username: u, password: p})
    });
    var data = await res.json();
    if (data.success) {
        document.getElementById("admin-login").style.display = "none";
        document.getElementById("container").style.display   = "block";
        loadUsers();
    } else {
        document.getElementById("error-msg").innerText = data.msg || "Administrador inválido.";
    }
}

async function loadUsers() {
    var res  = await fetch("/admin/get_users", {
        method:  "POST",
        headers: {"Content-Type": "application/json"},
        body:    JSON.stringify({})
    });
    var data = await res.json();
    if (data.success) renderUsers(data.users);
}

function renderUsers(users) {
    var list = document.getElementById("user-list");
    list.innerHTML = "";
    users.forEach(u => {
        var div     = document.createElement("div");
        div.className = "user-card";

        var info    = document.createElement("div");
        info.className = "user-info";
        info.innerText = u;

        var actions = document.createElement("div");
        actions.className = "user-actions";

        var editBtn = document.createElement("button");
        editBtn.className   = "btn btn-primary";
        editBtn.style.padding = "8px 12px";
        editBtn.innerText   = "Editar";
        editBtn.onclick     = () => openModal(u);

        var delBtn  = document.createElement("button");
        delBtn.className   = "btn btn-danger";
        delBtn.style.padding = "8px 12px";
        delBtn.innerText   = "✕";
        delBtn.onclick     = () => deleteUser(u);

        actions.appendChild(editBtn);
        actions.appendChild(delBtn);
        div.appendChild(info);
        div.appendChild(actions);
        list.appendChild(div);
    });
}

function openModal(u = null) {
    editing_u = u;
    document.getElementById("m_u").value = u || "";
    document.getElementById("m_p").value = "";
    if (u) {
        document.getElementById("modal-title").innerText = "Editar Estudante";
        document.getElementById("modal-desc").innerText  = "Deixe a senha em branco para manter a atual.";
    } else {
        document.getElementById("modal-title").innerText = "Novo Estudante";
        document.getElementById("modal-desc").innerText  = "Admin: entregue o dispositivo para o estudante.";
    }
    document.getElementById("modal").style.display = "flex";
}

function closeModal() { document.getElementById("modal").style.display = "none"; }

async function handleModalSave() {
    var u = document.getElementById("m_u").value.trim();
    var p = document.getElementById("m_p").value;
    if (!u || (!editing_u && !p)) return;
    var res  = await fetch("/admin/save_user", {
        method:  "POST",
        headers: {"Content-Type": "application/json"},
        body:    JSON.stringify({old_username: editing_u, username: u, password: p})
    });
    var data = await res.json();
    if (data.success) { closeModal(); loadUsers(); }
    else alert(data.msg);
}

async function deleteUser(u) {
    if (confirm("Excluir " + u + "?")) {
        await fetch("/admin/delete_user", {
            method:  "POST",
            headers: {"Content-Type": "application/json"},
            body:    JSON.stringify({username: u})
        });
        loadUsers();
    }
}
</script>
</body>
</html>
